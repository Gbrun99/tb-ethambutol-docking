<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. tuberculosis EmbC - Visualizador 3D Docking (WT vs M306V)</title>
  <!-- jQuery necesario para la carga AJAX de PDBs en 3Dmol.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://3dmol.org/build/3Dmol-min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; }
    h1 { color: #2c3e50; text-align: center; }
    p { text-align: center; color: #555; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 45%; min-width: 320px; }
    .mol-container { width: 100%; height: 420px; position: relative; border: 1px solid #ccc; border-radius: 4px; }
    .energy { font-weight: bold; text-align: center; padding: 8px; margin-top: 10px; border-radius: 4px; }
    .wt { background-color: #e8f5e9; color: #2e7d32; }
    .mut { background-color: #ffebee; color: #c62828; }
  </style>
</head>
<body>

  <h1>Análisis Estructural de Docking: Ethambutol en EmbC</h1>
  <p>Comparativa 3D de afinidad de unión: Cepa Silvestre (WT) vs. Mutante de Resistencia (M306V)</p>

  <div class="container">
    <!-- Contenedor WT -->
    <div class="card">
      <h2>Wild-Type (Met306)</h2>
      <div id="viewer_wt" class="mol-container"></div>
      <div class="energy wt">Energía de Unión (ΔG): -5.147 kcal/mol</div>
    </div>

    <!-- Contenedor Mutante M306V -->
    <div class="card">
      <h2>Mutante M306V (Val306)</h2>
      <div id="viewer_mut" class="mol-container"></div>
      <div class="energy mut">Energía de Unión (ΔG): -3.820 kcal/mol</div>
    </div>
  </div>

  <script>
    $(document).ready(function() {
      // 1. Cargar Estructura WT
      let elementWT = $('#viewer_wt');
      let configWT = { backgroundColor: 'white' };
      let viewerWT = $3Dmol.createViewer(elementWT, configWT);
      
      $.get('EmbC_WT.pdb', function(data) {
        viewerWT.addModel(data, "pdb");
        viewerWT.setStyle({}, {cartoon: {color: 'spectrum'}});
        viewerWT.zoomTo();
        viewerWT.render();
      });

      // 2. Cargar Estructura M306V
      let elementMut = $('#viewer_mut');
      let configMut = { backgroundColor: 'white' };
      let viewerMut = $3Dmol.createViewer(elementMut, configMut);

      $.get('receptor_M306V.pdb', function(data) {
        viewerMut.addModel(data, "pdb");
        viewerMut.setStyle({}, {cartoon: {color: 'red'}});
        viewerMut.zoomTo();
        viewerMut.render();
      });
    });
  </script>
</body>
</html>
